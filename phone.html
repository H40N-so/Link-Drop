<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="LinkDrop: stream your phone camera to a laptop and send files both ways, directly over WebRTC."
    />
    <title>LinkDrop · Phone</title>
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body data-role="phone">
    <!-- Soft ambient background (decorative). -->
    <div class="ambient" aria-hidden="true">
      <span class="orb orb--1"></span>
      <span class="orb orb--2"></span>
      <span class="orb orb--3"></span>
      <span class="grain"></span>
    </div>

    <div class="phone-shell">
      <header class="phone-header">
        <span class="phone-brand">
          <span class="brand-mark" aria-hidden="true">
            <svg class="icon"><use href="#i-link"></use></svg>
          </span>
          <span class="brand-name">LinkDrop</span>
        </span>
        <span class="topbar-spacer"></span>
        <span id="device-name" class="device-name" hidden></span>
        <span id="status-pill" class="status-pill" data-state="disconnected">
          <span class="status-dot" aria-hidden="true"></span>
          <span data-status-text data-i18n="status.disconnected"></span>
        </span>
        <button type="button" id="disconnect-btn" class="btn btn--ghost btn--small" hidden data-i18n="phone.disconnect"></button>
      </header>

      <main class="phone-content">
        <div id="notice" class="notice" role="status" hidden>
          <span class="notice-text" data-notice-text></span>
          <button type="button" class="btn btn--ghost btn--small" data-notice-close data-i18n="common.close"></button>
        </div>

        <div data-screens>
          <!-- Landing ------------------------------------------------ -->
          <section class="screen screen--entry" data-screen="landing" aria-labelledby="phone-landing-title">
            <div class="entry-head">
              <h1 class="page-title" id="phone-landing-title" data-i18n="phone.landingTitle"></h1>
              <p class="page-subtitle" data-i18n="phone.landingSubtitle"></p>
            </div>

            <div class="entry-card card--glass">
              <span class="label" data-i18n="phone.enterCode"></span>
              <div class="code-cells" data-code-cells role="group" aria-label="Pairing code" data-i18n-attr="aria-label:phone.enterCode">
                <input class="code-cell" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="1" />
                <input class="code-cell" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="2" />
                <input class="code-cell" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="3" />
                <input class="code-cell" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="4" />
                <input class="code-cell" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="5" />
                <input class="code-cell" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="6" />
                <input class="code-cell" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="7" />
                <input class="code-cell" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="8" />
              </div>
              <p class="muted small" data-i18n="phone.codeHint"></p>

              <button type="button" class="btn btn--primary btn--block" data-action="phone-connect" data-i18n="phone.connect"></button>

              <div class="entry-sep" aria-hidden="true"><span></span></div>

              <button type="button" class="btn btn--block" data-action="scan">
                <svg class="icon icon--sm"><use href="#i-scan"></use></svg>
                <span data-i18n="phone.scanQr"></span>
              </button>

              <div id="phone-landing-status" class="inline-status" hidden>
                <p class="inline-status-text" data-error-text></p>
                <p class="inline-status-hint muted small" data-error-hint hidden></p>
                <button
                  type="button"
                  class="btn btn--small"
                  data-action="retry-signaling"
                  data-i18n="connect.retry"
                  hidden
                ></button>
              </div>
            </div>
          </section>

          <!-- Connecting --------------------------------------------- -->
          <section class="screen screen--entry" data-screen="connecting" aria-labelledby="phone-connecting-title">
            <div class="connecting">
              <span class="spinner" aria-hidden="true">
                <svg viewBox="0 0 50 50" width="44" height="44">
                  <circle class="spinner-track" cx="25" cy="25" r="20" fill="none" stroke-width="4" />
                  <circle class="spinner-head" cx="25" cy="25" r="20" fill="none" stroke-width="4" stroke-linecap="round" />
                </svg>
              </span>
              <h1 class="page-title" id="phone-connecting-title" data-i18n="phone.connectingTo"></h1>
              <p class="muted" id="phone-connecting-detail"></p>
              <button type="button" class="btn btn--ghost" data-action="cancel-connect" data-i18n="common.cancel"></button>
            </div>
          </section>

          <!-- Camera (the connected screen) -------------------------- -->
          <section class="screen" data-screen="camera" aria-labelledby="phone-camera-title">
            <div class="page-head">
              <h1 class="page-title" id="phone-camera-title" data-i18n="phone.camTitle"></h1>
            </div>

            <div class="phone-connected card--glass" id="phone-connected">
              <span class="connected-check connected-check--sm" aria-hidden="true">
                <svg class="icon icon--lg"><use href="#i-check"></use></svg>
              </span>
              <div class="phone-connected__text">
                <span class="phone-connected__name" data-phone-peer>—</span>
                <small class="muted" id="phone-status" data-phone-status data-i18n="phone.notStreaming"></small>
              </div>
            </div>

            <video class="phone-preview" data-phone-preview autoplay playsinline muted></video>

            <div class="card card--pad">
              <div class="phone-status">
                <span class="phone-status-icon" aria-hidden="true">
                  <svg class="icon"><use href="#i-camera"></use></svg>
                </span>
                <div>
                  <div class="phone-status-title" data-i18n="phone.camera"></div>
                  <small class="muted" data-phone-detail></small>
                </div>
              </div>

              <div class="phone-actions">
                <button type="button" class="btn btn--primary" data-phone-start data-i18n="phone.start"></button>
                <button type="button" class="btn btn--danger" data-phone-stop data-i18n="phone.stop" hidden></button>
              </div>

              <p class="muted small" data-i18n="phone.keepAwake"></p>
            </div>
          </section>

          <!-- Files -------------------------------------------------- -->
          <section class="screen" data-screen="files" aria-labelledby="phone-files-title">
            <div class="page-head">
              <h1 class="page-title" id="phone-files-title" data-i18n="files.title"></h1>
              <p class="page-subtitle" data-i18n="files.subtitle"></p>
            </div>

            <div class="card card--pad">
              <button type="button" class="btn btn--primary btn--block" data-files-send>
                <svg class="icon icon--sm"><use href="#i-upload"></use></svg>
                <span data-i18n="files.send"></span>
              </button>
              <input type="file" data-files-input multiple hidden />
              <p class="muted small" data-i18n="files.note"></p>
            </div>

            <div class="files-head">
              <h2 class="card-title" data-i18n="files.session"></h2>
              <button type="button" class="btn btn--ghost btn--small" data-files-clear data-i18n="files.clear"></button>
            </div>

            <div class="empty-state" data-files-empty>
              <svg class="icon icon--lg"><use href="#i-folder"></use></svg>
              <p data-i18n="files.emptyPhone"></p>
            </div>
            <ul class="transfer-list" data-transfer-list></ul>
          </section>

          <!-- Settings ----------------------------------------------- -->
          <section class="screen" data-screen="settings" aria-labelledby="phone-settings-title">
            <div class="page-head">
              <h1 class="page-title" id="phone-settings-title" data-i18n="settings.title"></h1>
              <p class="page-subtitle" data-i18n="settings.subtitle"></p>
            </div>
            <div data-settings-host></div>
          </section>

          <!-- Help --------------------------------------------------- -->
          <section class="screen" data-screen="help" aria-labelledby="phone-help-title">
            <div class="page-head">
              <h1 class="page-title" id="phone-help-title" data-i18n="help.title"></h1>
              <p class="page-subtitle" data-i18n="help.subtitle"></p>
            </div>

            <section class="card">
              <h2 class="card-title" data-i18n="help.check.title"></h2>
              <div class="card-body">
                <p class="muted small" data-i18n="help.check.body"></p>
                <div data-connection-check></div>
              </div>
            </section>

            <section class="card">
              <div class="card-body help-sections">
                <div class="help-section">
                  <h2 data-i18n="help.pairing.title"></h2>
                  <p data-i18n="help.pairing.body"></p>
                </div>
                <div class="help-section">
                  <h2 data-i18n="help.verify.title"></h2>
                  <p data-i18n="help.verify.body"></p>
                </div>
                <div class="help-section">
                  <h2 data-i18n="help.troubleshooting.title"></h2>
                  <ul class="steps">
                    <li data-i18n="help.troubleshooting.camera"></li>
                    <li data-i18n="help.troubleshooting.turn"></li>
                    <li data-i18n="help.troubleshooting.files"></li>
                  </ul>
                </div>
                <div class="help-section">
                  <h2 data-i18n="help.privacy.title"></h2>
                  <p data-i18n="help.privacy.body"></p>
                </div>
              </div>
            </section>
          </section>
        </div>
      </main>

      <nav class="tabbar" aria-label="Main navigation">
        <span class="tab-indicator" aria-hidden="true"></span>
        <button type="button" class="nav-item" data-nav="camera">
          <svg class="icon icon--lg"><use href="#i-camera"></use></svg>
          <span data-i18n="nav.camera"></span>
        </button>
        <button type="button" class="nav-item" data-nav="files">
          <svg class="icon icon--lg"><use href="#i-folder"></use></svg>
          <span data-i18n="nav.files"></span>
        </button>
        <button type="button" class="nav-item" data-nav="settings">
          <svg class="icon icon--lg"><use href="#i-settings"></use></svg>
          <span data-i18n="nav.settings"></span>
        </button>
        <button type="button" class="nav-item" data-nav="help">
          <svg class="icon icon--lg"><use href="#i-help"></use></svg>
          <span data-i18n="nav.help"></span>
        </button>
      </nav>
    </div>

    <!-- Full-page message shown when phone.html is opened on a computer. -->
    <div id="role-message" class="role-message" hidden>
      <div class="role-message__inner">
        <span class="brand-mark brand-mark--lg" aria-hidden="true">
          <svg class="icon icon--lg"><use href="#i-link"></use></svg>
        </span>
        <h1 class="page-title" data-i18n="role.phoneOnDesktop.title"></h1>
        <p class="page-subtitle" data-i18n="role.phoneOnDesktop.body"></p>
      </div>
    </div>

    <!-- In-page QR scanner (phone only). -->
    <div id="scanner" class="scanner" hidden>
      <div class="scanner-inner">
        <div class="scanner-head">
          <h2 data-i18n="phone.scanTitle"></h2>
          <button type="button" class="btn btn--ghost btn--small" data-action="scan-close" data-i18n="phone.back"></button>
        </div>
        <div class="scanner-view">
          <video id="scanner-video" playsinline muted></video>
          <span class="scanner-frame" aria-hidden="true"></span>
        </div>
        <p id="scanner-msg" class="scanner-msg muted"></p>
      </div>
    </div>

    <div id="toasts" class="ld-toasts" role="region" aria-label="Notifications" aria-live="polite" aria-atomic="false"></div>

    <script src="vendor/peerjs.min.js"></script>
    <script src="vendor/jsQR.js"></script>
    <script type="module" src="js/ui.js"></script>
  </body>
</html>
